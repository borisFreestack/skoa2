name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates-ddd:
    name: Gates DDD (artefacts, langage, invariants)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: gates/.python-version
          cache: pip
          cache-dependency-path: gates/requirements.txt

      - run: pip install -r gates/requirements.txt

      # Les gates doivent savoir échouer : leurs tests le prouvent avant qu'on les croie.
      - name: Tests des gates
        run: python -m unittest discover -s gates/tests -t gates/tests

      - name: Artefacts de contexts/
        run: python gates/verifier.py artefacts

      - name: Langage (glossaires et vocabulaire interdit)
        run: python gates/verifier.py langage

      - name: Invariants couverts
        run: python gates/verifier.py invariants

  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Génère les interfaces et DTO depuis contracts/, compile, teste (dont Spring Modulith verify
      # et la gate « conformité à la context map », ContextMapTest).
      - name: Build et tests
        run: ./gradlew build

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Chaque script régénère d'abord les clients depuis contracts/.
      - name: Lint et frontières Sheriff
        run: npm run lint

      - name: Tests
        run: npm test -- --watch=false

      - name: Build de production
        run: npm run build

  contrats:
    name: Contrat ${{ matrix.bc }} (changements cassants)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        bc: [mise-en-relation, rencontre, suivi]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Contrat présent sur la branche de base ?
        id: base
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:contracts/${{ matrix.bc }}/openapi.yaml" 2>/dev/null; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "Nouveau contrat, rien à comparer." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comparer au contrat de la branche de base
        if: steps.base.outputs.existe == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: "origin/${{ github.base_ref }}:contracts/${{ matrix.bc }}/openapi.yaml"
          revision: "HEAD:contracts/${{ matrix.bc }}/openapi.yaml"
          fail-on: WARN
          # Aucun contrat ne quitte la CI.
          review: false
